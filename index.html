```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYH3M OS 9.0</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

/* ===== NEW 3DS XL CONSOLE ===== */

.console {
    width: min(96vw, 1000px);
    padding: 28px;
}

/* ===== TOP HALF ===== */

.top-shell {
    background: linear-gradient(145deg, #252525, #0c0c0c);
    border-radius: 28px 28px 14px 14px;
    padding: 32px 48px 42px;
    border: 4px solid #333;
    box-shadow:
        inset 0 2px 3px #555,
        0 15px 35px rgba(0,0,0,.7);
}

.top-camera {
    width: 12px;
    height: 12px;
    background: #050505;
    border: 2px solid #444;
    border-radius: 50%;
    margin: 0 auto 14px;
}

.top-screen-frame {
    background: #050505;
    border: 7px solid #151515;
    border-radius: 12px;
    padding: 6px;
}

.top-screen {
    aspect-ratio: 5 / 3;
    width: 100%;
    overflow: hidden;
    position: relative;
    background:
        radial-gradient(circle at 20% 20%, #008cff55, transparent 35%),
        radial-gradient(circle at 80% 70%, #00e5ff44, transparent 30%),
        linear-gradient(135deg, #07111c, #10283b, #061018);
    display: flex;
    flex-direction: column;
}

.top-status {
    height: 52px;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,.35);
    border-bottom: 1px solid #ffffff22;
    font-size: clamp(11px, 2vw, 18px);
}

.logo {
    font-weight: 900;
    letter-spacing: 3px;
    color: #7eeaff;
    text-shadow: 0 0 10px #00c8ff;
}

.status-right {
    display: flex;
    gap: 16px;
    color: #dcefff;
}

.top-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
}

.os-title {
    font-size: clamp(32px, 7vw, 78px);
    font-weight: 900;
    letter-spacing: 5px;
    margin: 0;
    text-shadow: 0 0 20px #00d9ff;
}

.os-subtitle {
    margin-top: 14px;
    font-size: clamp(12px, 2vw, 22px);
    color: #b9eaff;
    letter-spacing: 2px;
}

/* ===== HINGE ===== */

.hinge {
    height: 42px;
    width: 82%;
    margin: auto;
    background: linear-gradient(#333, #111, #333);
    border-left: 4px solid #444;
    border-right: 4px solid #444;
    box-shadow: 0 8px 14px rgba(0,0,0,.7);
}

/* ===== BOTTOM HALF ===== */

.bottom-shell {
    position: relative;
    min-height: 650px;
    background: linear-gradient(145deg, #292929, #101010);
    border-radius: 14px 14px 32px 32px;
    border: 4px solid #333;
    padding: 34px;
    display: grid;
    grid-template-columns: 150px minmax(0, 1fr) 150px;
    gap: 25px;
    box-shadow:
        inset 0 2px 3px #555,
        0 20px 40px rgba(0,0,0,.8);
}

/* ===== LEFT CONTROLS ===== */

.left-controls,
.right-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.circle-pad {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    margin-top: 10px;
    background:
        repeating-radial-gradient(circle, #555 0 2px, #333 3px 6px);
    border: 8px solid #1b1b1b;
    box-shadow:
        inset 0 0 15px #000,
        0 5px 10px #000;
}

.dpad {
    width: 105px;
    height: 105px;
    position: relative;
    margin-top: 65px;
}

.dpad::before,
.dpad::after {
    content: "";
    position: absolute;
    background: linear-gradient(#333, #111);
    border: 2px solid #555;
    border-radius: 8px;
    box-shadow: 0 3px 5px #000;
}

.dpad::before {
    width: 38px;
    height: 105px;
    left: 33px;
}

.dpad::after {
    width: 105px;
    height: 38px;
    top: 33px;
}

/* ===== BOTTOM SCREEN ===== */

.bottom-center {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.bottom-screen-frame {
    width: 100%;
    max-width: 560px;
    background: #050505;
    border: 9px solid #171717;
    border-radius: 12px;
    padding: 5px;
    box-shadow: inset 0 0 15px #000;
}

.bottom-screen {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(145deg, #06131e, #0b2435);
    overflow: hidden;
    position: relative;
}

/* ===== MAYH3M GAME LIBRARY ===== */

.library-header {
    height: 18%;
    min-height: 55px;
    padding: 10px 18px;
    background: rgba(0,0,0,.4);
    border-bottom: 1px solid #53dfff55;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.library-title {
    font-weight: bold;
    letter-spacing: 2px;
    color: #79e8ff;
    font-size: clamp(11px, 2vw, 19px);
}

.game-count {
    font-size: clamp(9px, 1.5vw, 14px);
    color: #b8d8e5;
}

.games {
    height: 72%;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 14px;
}

.game {
    border: 1px solid #42caff66;
    border-radius: 8px;
    min-height: 70px;
    background:
        linear-gradient(145deg, #17384c, #07131d);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 6px;
    transition: .15s;
}

.game:active {
    transform: scale(.95);
    background: #145777;
}

.game-icon {
    font-size: clamp(20px, 4vw, 38px);
}

.game-name {
    font-size: clamp(7px, 1.2vw, 12px);
    margin-top: 5px;
    text-align: center;
    word-break: break-word;
}

.library-footer {
    height: 10%;
    min-height: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 15px;
    background: rgba(0,0,0,.4);
    border-top: 1px solid #ffffff18;
    font-size: clamp(8px, 1.2vw, 12px);
    color: #9ac9d8;
}

/* ===== RIGHT CONTROLS ===== */

.c-stick {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    margin-top: 5px;
    background: repeating-radial-gradient(circle, #555 0 2px, #222 3px 5px);
    border: 6px solid #181818;
}

.abxy {
    width: 120px;
    height: 120px;
    position: relative;
    margin-top: 45px;
}

.button {
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid #555;
    background: radial-gradient(circle at 30% 25%, #555, #111 65%);
    color: white;
    font-weight: bold;
    font-size: 18px;
    box-shadow: 0 4px 6px #000;
    cursor: pointer;
}

.button:active {
    transform: translateY(2px);
}

.btn-y { left: 0; top: 37px; }
.btn-x { left: 37px; top: 0; }
.btn-a { right: 0; top: 37px; }
.btn-b { left: 37px; bottom: 0; }

.small-buttons {
    margin-top: 55px;
    display: flex;
    gap: 16px;
}

.small-button {
    width: 65px;
    height: 25px;
    border-radius: 12px;
    background: #161616;
    border: 2px solid #444;
    color: #aaa;
    font-size: 9px;
}

/* ===== HOME BUTTON ===== */

.home-button {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 35px;
    border-radius: 18px;
    background: linear-gradient(#333, #111);
    border: 2px solid #555;
    color: #ddd;
    font-size: 10px;
    cursor: pointer;
}

/* ===== MOBILE ===== */

@media (max-width: 700px) {
    .console {
        width: 100vw;
        padding: 8px;
    }

    .top-shell {
        padding: 15px 18px 20px;
    }

    .hinge {
        height: 24px;
    }

    .bottom-shell {
        min-height: 520px;
        padding: 16px 8px 55px;
        grid-template-columns: 65px minmax(0, 1fr) 65px;
        gap: 5px;
    }

    .circle-pad {
        width: 58px;
        height: 58px;
        border-width: 5px;
    }

    .dpad {
        transform: scale(.6);
        margin-top: 15px;
    }

    .c-stick {
        width: 38px;
        height: 38px;
    }

    .abxy {
        transform: scale(.55);
        margin-top: 0;
    }

    .small-buttons {
        margin-top: -5px;
        transform: scale(.7);
    }

    .games {
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        padding: 7px;
    }

    .game {
        min-height: 52px;
    }
}
</style>
</head>

<body>

<div class="console">

    <!-- TOP SCREEN -->
    <section class="top-shell">

        <div class="top-camera"></div>

        <div class="top-screen-frame">
            <div class="top-screen">

                <div class="top-status">
                    <div class="logo">⚡ ELECTRIC MAYH3M</div>

                    <div class="status-right">
                        <span>📶</span>
                        <span id="clock">--:--</span>
                        <span>🔋 100%</span>
                    </div>
                </div>

                <div class="top-content">
                    <div>
                        <h1 class="os-title">MAYH3M OS</h1>
                        <div class="os-subtitle">
                            NEW NINTENDO 3DS XL EDITION
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </section>

    <!-- HINGE -->
    <div class="hinge"></div>

    <!-- BOTTOM HALF -->
    <section class="bottom-shell">

        <!-- LEFT CONTROLS -->
        <div class="left-controls">

            <div class="circle-pad"></div>

            <div class="dpad"></div>

        </div>

        <!-- BOTTOM SCREEN -->
        <div class="bottom-center">

            <div class="bottom-screen-frame">

                <div class="bottom-screen">

                    <div class="library-header">
                        <div class="library-title">
                            🎮 GAME LIBRARY
                        </div>

                        <div class="game-count" id="gameCount">
                            0 GAMES
                        </div>
                    </div>

                    <div class="games" id="games">

                        <!-- Games appear here -->

                    </div>

                    <div class="library-footer">
                        <span>◀ SELECT</span>
                        <span>MAYH3M OS 9.0</span>
                        <span>START ▶</span>
                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT CONTROLS -->
        <div class="right-controls">

            <div class="c-stick"></div>

            <div class="abxy">
                <button class="button btn-y">Y</button>
                <button class="button btn-x">X</button>
                <button class="button btn-a">A</button>
                <button class="button btn-b">B</button>
            </div>

            <div class="small-buttons">
                <button class="small-button">SELECT</button>
                <button class="small-button">START</button>
            </div>

        </div>

        <button class="home-button" onclick="goHome()">
            HOME
        </button>

    </section>

</div>

<script>

/* ===== CLOCK ===== */

function updateClock() {
    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });
}

updateClock();
setInterval(updateClock, 1000);


/* =====================================================
   GAME LIBRARY
   =====================================================

   The HTML preview cannot directly read the games installed
   on your real Nintendo 3DS.

   When this interface is later packaged as a real 3DS
   homebrew application, the game-reading code can provide
   the installed title list to this interface.

   For the web version, updateGameLibrary() receives the
   game list and automatically builds the full library.
*/


function updateGameLibrary(gameList) {

    const games = document.getElementById("games");

    games.innerHTML = "";

    gameList.forEach((game) => {

        const card = document.createElement("div");

        card.className = "game";

        card.innerHTML = `
            <div class="game-icon">
                ${game.icon || "🎮"}
            </div>

            <div class="game-name">
                ${game.name}
            </div>
        `;

        card.onclick = function() {
            launchGame(game);
        };

        games.appendChild(card);

    });

    document.getElementById("gameCount").textContent =
        gameList.length +
        (gameList.length === 1 ? " GAME" : " GAMES");
}


/* ===== GAME LAUNCH PLACEHOLDER ===== */

function launchGame(game) {

    alert(
        "Launching " + game.name +
        "\n\nMAYH3M OS would send this title to the 3DS launcher."
    );

}


/* ===== HOME BUTTON ===== */

function goHome() {

    alert("MAYH3M OS HOME");

}


/* =====================================================
   TEST DATA

   Remove this test data when the real 3DS application
   connects its installed-title reader.

   The interface will then display whatever titles are
   actually installed on that 3DS.
   ===================================================== */

const installedGames = [

    {
        name: "Mario Kart 7",
        icon: "🏎️"
    },

    {
        name: "Minecraft",
        icon: "⛏️"
    },

    {
        name: "Super Smash Bros.",
        icon: "💥"
    },

    {
        name: "Animal Crossing",
        icon: "🏝️"
    },

    {
        name: "Pokémon",
        icon: "⚡"
    },

    {
        name: "3DS Camera",
        icon: "📷"
    },

    {
        name: "Nintendo eShop",
        icon: "🛍️"
    },

    {
        name: "System Settings",
        icon: "⚙️"
    }

];


/* Build the library */

updateGameLibrary(installedGames);

</script>

</body>
</html>
